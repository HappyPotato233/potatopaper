[project]
name = "literature-radar"
version = "2.0.0"
description = "文献雷达 · 科研文献持续跟踪助手（Vue3 SPA + FastAPI + Worker + MySQL8 + 多Agent）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1.0",
    "cryptography>=42",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "rank-bm25>=0.2.2",
    "tavily-python>=0.5.0",
    "langgraph>=1.1.9",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=1.27.0",
    "python-docx>=1.1.0",
    "pytest>=8",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # 让 tests 里能 import app
